<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7efff">
  <meta name="description" content="Opération Hasard : dix épreuves, dix surprises et une aventure imaginée spécialement pour toi.">
  <title>Opération Hasard — Dossier ultra-secret</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/hero-illustration.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="ambient ambient-three" aria-hidden="true"></div>
  <div class="floating-sparkles" aria-hidden="true">
    <span>✦</span><span>✧</span><span>♡</span><span>✦</span><span>✧</span><span>♡</span>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="Retour à l'accueil">
        <span class="brand-mark">✦</span>
        <span class="brand-copy"><strong>OPÉRATION HASARD</strong><small>un dossier tout doux, ultra-secret</small></span>
      </button>
      <div class="topbar-actions">
        <div class="mini-progress" id="mini-progress" hidden aria-label="Progression de la mission">
          <span id="progress-label">0/10</span>
          <span class="mini-progress-track"><span id="progress-fill"></span></span>
        </div>
        <button class="icon-button" id="sound-toggle" aria-label="Activer la musique" title="Ambiance sonore">♫ <span id="sound-label">Son</span></button>
        <button class="icon-button map-button" data-action="map" aria-label="Ouvrir la carte des niveaux" title="Carte des niveaux">⌘ <span>Carte</span></button>
      </div>
    </header>

    <main id="screen" tabindex="-1" aria-live="polite"></main>

    <footer class="site-footer">
      <span>fait avec ✿, quelques étoiles et beaucoup d'imagination</span>
      <span class="footer-dot">•</span>
      <span>aucune course contre le temps de la vraie vie</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
